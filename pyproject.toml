[project]
name = "tiles-survive-automation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "opencv-python>=4.10",
    "mss>=9.0",
    "pynput>=1.7",
    "pywin32>=306; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiles_survive_automation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
